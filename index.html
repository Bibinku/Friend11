<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141c3a" />
    <meta
      name="description"
      content="FRIEND11 — Find. Match. Play. Friendly eFootball match rooms, live for 10 minutes. An independent community site, not affiliated with KONAMI or eFootball."
    />
    <title>FRIEND11 — Find. Match. Play.</title>
    <!-- Apply the saved theme before first paint so there is no flash. -->
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('friend11_theme_v1'));
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
            if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#eceffa');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
